<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMP化學機械研磨機操作小幫手</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="CMP 文件問答 Logo">
        <div class="brand-copy">
          <span class="eyebrow">LOCAL RAG</span>
          <h1>CMP化學機械研磨機操作小幫手</h1>
          <p>回答依據目前載入的 PDF 文件，也可附加圖片輔助分析。</p>
        </div>
      </div>
      <div class="actions"><button id="clear" type="button">清除對話</button><button id="end-chat" type="button">結束對話</button></div>
    </header>
    <section id="messages" aria-live="polite" aria-busy="false"></section>
    <script id="suggested-questions-data" type="application/json">{{ suggested_questions | tojson }}</script>
    <form id="chat-form" data-max-files="{{ upload_max_files }}" data-max-file-bytes="{{ upload_max_file_mb * 1024 * 1024 }}" data-max-total-bytes="{{ upload_max_total_mb * 1024 * 1024 }}">
      <label for="question">請輸入文件相關問題</label>
      <div class="composer">
        <textarea id="question" rows="2" placeholder="輸入問題；Enter 送出，Shift+Enter 換行"></textarea>
        <button id="send" type="submit" disabled>送出</button>
      </div>
      <div class="attachments">
        <label class="upload-button" for="attachments">＋ 加入圖片</label>
        <input id="attachments" name="attachments" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <span class="upload-hint">可選擇或直接貼上圖片。最多 {{ upload_max_files }} 張；單張 {{ upload_max_file_mb }} MB、合計 {{ upload_max_total_mb }} MB。附件僅用於當次 QA，不會加入知識庫。</span>
      </div>
      <div id="attachment-preview" class="attachment-preview"></div>
      <div class="report-actions">
        <button id="export-report" type="button" disabled>輸出對話報告</button>
      </div>
      <p id="status" role="status"><span id="status-text"></span></p>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
